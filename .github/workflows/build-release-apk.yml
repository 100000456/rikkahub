name: Build Release APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-release-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web-ui/pnpm-lock.yaml

      - name: Install web-ui dependencies
        working-directory: web-ui
        run: |
          mkdir -p ../ci-logs
          pnpm install --frozen-lockfile 2>&1 | tee ../ci-logs/pnpm.log

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-release-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Restore signing keystore
        uses: actions/cache@v4
        with:
          path: ci/keystore.jks
          key: keystore-${{ github.run_id }}
          restore-keys: |
            keystore-

      - name: Prepare signing config
        run: |
          mkdir -p ci
          if [ ! -f ci/keystore.jks ]; then
            keytool -genkeypair -keystore ci/keystore.jks -storetype JKS \
              -storepass rikkahubselfbuild -keypass rikkahubselfbuild \
              -alias rikkahub -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=RikkaHub Self Build"
          fi
          printf 'storeFile=%s/ci/keystore.jks\n' "$GITHUB_WORKSPACE" > local.properties
          printf 'storePassword=rikkahubselfbuild\n' >> local.properties
          printf 'keyAlias=rikkahub\n' >> local.properties
          printf 'keyPassword=rikkahubselfbuild\n' >> local.properties
          sed -e 's/storePassword=.*/storePassword=***/' local.properties

      - name: Write placeholder google-services.json
        run: |
          mkdir -p app ci-logs
          cat > app/google-services.json <<'JSON_EOF'
          {
            "project_info": {
              "project_number": "123456789012",
              "firebase_url": "https://rikkahub-placeholder.firebaseio.com",
              "project_id": "rikkahub-placeholder",
              "storage_bucket": "rikkahub-placeholder.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:123456789012:android:0000000000000000000000",
                  "android_client_info": {
                    "package_name": "me.rerere.rikkahub"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "AIzaSyDplaceholder000000000000000000000"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          JSON_EOF

      - name: Write gradle init script
        run: |
          mkdir -p ci
          cat > ci/selfuse.gradle <<'EOF'
          gradle.projectsEvaluated {
            rootProject.allprojects {
              tasks.matching { it.name.startsWith('uploadCrashlyticsMappingFile') }.configureEach {
                enabled = false
              }
            }
          }
          EOF

      - name: Build release APK
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew :app:assembleRelease --stacktrace --init-script ci/selfuse.gradle 2>&1 | tee ci-logs/gradle-release.log

      - name: Dump failure info
        if: failure()
        run: |
          {
            echo "=== release failure at $(date -u) ==="
            echo "--- java ---"; java -version 2>&1 || true
            echo "--- pnpm tail ---"; tail -n 60 ci-logs/pnpm.log 2>/dev/null || true
            echo "--- gradle tail ---"; tail -n 500 ci-logs/gradle-release.log 2>/dev/null || true
          } > .ci-failure-release.txt
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add -f .ci-failure-release.txt
          git commit -m "ci: dump release failure log" || true
          git push origin HEAD:master || true

      - name: Publish release APK
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: release-build
          name: Release Build
          prerelease: true
          body: |
            自用正式包，无开发模式标记，来源 commit ${{ github.sha }}

            基于 RikkaHub 源码，正式签名，可与橘瓣共存。
          files: app/build/outputs/apk/release/*.apk

