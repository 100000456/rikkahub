name: DI Audit

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/di-audit.yml'

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Dump approval flow
        run: |
          set -u
          OUT=.di-audit.txt
          PS=app/src/main/java/me/rerere/rikkahub/data/datastore/PreferencesStore.kt
          {
            echo "===== A. Settings 类（前 150 行） ====="
            sed -n '1,150p' "$PS"
            echo
            echo "===== A2. Settings 类里所有字段名 ====="
            grep -nE '^    (val|var) ' "$PS" | head -80
            echo
            echo "===== B. needsApproval 调用点（带上下文） ====="
            grep -rn 'needsApproval' app/src/main/java --include='*.kt' -B6 -A12 || echo none
            echo
            echo "===== C. 含审批/硬线字样的文件 ====="
            grep -rliE 'approval|approve|hardline|headless' app/src/main/java --include='*.kt' | sort || echo none
            echo
            echo "===== D. ConversationSession 里的审批段 ====="
            grep -nE 'pproval|pprove|hardline|Hardline|headless' app/src/main/java/me/rerere/rikkahub/service/ConversationSession.kt -B3 -A18 || echo none
            echo
            echo "===== E. HardlineCommandGuard 全文 ====="
            cat app/src/main/java/me/rerere/rikkahub/data/ai/tools/HardlineCommandGuard.kt 2>/dev/null || echo none
          } > "$OUT"
          wc -l "$OUT"

      - name: Commit dump
        run: |
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add -f .di-audit.txt
          git commit -m "ci: approval flow dump" || true
          git push origin HEAD:master || (git pull --rebase origin master && git push origin HEAD:master)
