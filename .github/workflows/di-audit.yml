name: DI Audit

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/di-audit.yml'

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Dump wiring surface
        run: |
          set -u
          OUT=.di-audit.txt
          {
            echo "===== A. GenerationLoop 170-215 ====="
            sed -n '160,215p' app/src/main/java/me/rerere/rikkahub/data/ai/GenerationLoop.kt
            echo "----- GenerationLoop imports -----"
            sed -n '1,40p' app/src/main/java/me/rerere/rikkahub/data/ai/GenerationLoop.kt
            echo
            echo "===== B. RouteActivity: Screen 定义 ====="
            grep -nE 'data object|sealed (class|interface) Screen|object Screen' app/src/main/java/me/rerere/rikkahub/RouteActivity.kt | head -80
            echo "----- RouteActivity: 设置页相关的 entry -----"
            grep -nE 'Setting|entry<|entry\(' app/src/main/java/me/rerere/rikkahub/RouteActivity.kt | head -120
            echo
            echo "===== C. SettingPage.kt 全文 ====="
            cat app/src/main/java/me/rerere/rikkahub/ui/pages/setting/SettingPage.kt
            echo
            echo "===== D. WorkflowEngine: 动作执行段 ====="
            grep -nE 'execute|headless|Headless|HARDLINE|hardline|needsApproval|actionRunner' app/src/main/java/me/rerere/rikkahub/workflow/execution/WorkflowEngine.kt -B4 -A22 | head -220
          } > "$OUT"
          wc -l "$OUT"

      - name: Commit dump
        run: |
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add -f .di-audit.txt
          git commit -m "ci: wiring surface dump" || true
          git push origin HEAD:master || (git pull --rebase origin master && git push origin HEAD:master)
