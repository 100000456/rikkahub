name: DI Audit

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/di-audit.yml'

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Dump blocks
        run: |
          set -u
          OUT=.di-wiring.txt
          SP=app/src/main/java/me/rerere/rikkahub/ui/pages/setting/SettingPage.kt
          WE=app/src/main/java/me/rerere/rikkahub/workflow/execution/WorkflowEngine.kt
          {
            echo "===== A. SettingPage 245-292 ====="
            sed -n '245,292p' "$SP"
            echo
            echo "===== B. WorkflowEngine 215-345 ====="
            sed -n '215,345p' "$WE"
          } > "$OUT"
          wc -l "$OUT"

      - name: Commit dump
        run: |
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add -f .di-wiring.txt
          git commit -m "ci: block dump" || true
          git push origin HEAD:master || (git pull --rebase origin master && git push origin HEAD:master)
