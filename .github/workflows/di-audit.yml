name: DI Audit

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/di-audit.yml'

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Dump DI surface
        run: |
          set -u
          OUT=.di-audit.txt
          MODFILES=$(grep -rlE 'val [A-Za-z0-9_]*[Mm]odule *= *module' app/src/main/java --include='*.kt' || true)
          {
            echo "===== 0. preflight: 已经打进仓库的补丁还在不在 ====="
            F=app/src/main/java/me/rerere/rikkahub/plugin/webview/PluginWebViewPage.kt
            echo "message.parts count = $(grep -c 'response.message.parts' "$F" || true)"
            echo "safe-replace count = $(grep -c ')?\.replace(' "$F" || true)"
            echo "raw-replace count = $(grep -c ')\.replace(' "$F" || true)"
            echo "--- line 276-279 ---"
            sed -n '276,279p' "$F"
            echo "--- line 400-402 ---"
            sed -n '400,402p' "$F"
            echo "--- line 1052-1054 ---"
            sed -n '1052,1054p' "$F"
            echo "--- 崩溃日志截断长度 ---"
            grep -n 'MAX_STACKTRACE_LENGTH' app/src/main/java/me/rerere/rikkahub/utils/CrashHandler.kt || true
            echo
            echo "===== 1. typed lookups get<T>() ====="
            grep -rhoE 'get<[A-Za-z0-9_.]+>' app/src/main/java --include='*.kt' | sed -e 's/^get<//' -e 's/>$//' | sort | uniq -c | sort -rn
            echo
            echo "===== 2. 定义清单（文件 + 类型） ====="
            for f in $MODFILES; do
              echo "----- $f"
              grep -nE 'single|factory|viewModel|get<|get\(\)|androidContext\(\)|includes\(' "$f" || true
            done
            echo
            echo "===== 3. 谁在往容器里伸手（inject / GlobalContext / KoinJavaComponent） ====="
            grep -rnE 'by inject|inject<|KoinComponent|GlobalContext|KoinJavaComponent|getKoin\(\)' app/src/main/java --include='*.kt' || true
          } > "$OUT"
          wc -l "$OUT"

      - name: Commit dump
        run: |
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add -f .di-audit.txt
          git commit -m "ci: DI audit dump" || true
          git push origin HEAD:master || (git pull --rebase origin master && git push origin HEAD:master)
