name: DI Audit

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/di-audit.yml'

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Dump wiring surface
        run: |
          set -u
          OUT=.di-wiring.txt
          RA=app/src/main/java/me/rerere/rikkahub/RouteActivity.kt
          SP=app/src/main/java/me/rerere/rikkahub/ui/pages/setting/SettingPage.kt
          WE=app/src/main/java/me/rerere/rikkahub/workflow/execution/WorkflowEngine.kt
          {
            echo "===== A. RouteActivity: 所有 Screen 成员 ====="
            grep -nE 'object : Screen|data object [A-Za-z]+ *: *Screen|data object [A-Za-z]+ *$' "$RA" | head -80
            echo
            echo "===== B. RouteActivity: SettingProactiveMessage 相关行（前后 8 行）====="
            grep -n 'SettingProactiveMessage' "$RA" || true
            for n in $(grep -n 'SettingProactiveMessage' "$RA" | cut -d: -f1); do
              s=$((n-10)); [ $s -lt 1 ] && s=1
              e=$((n+14))
              echo "--- around $n ---"
              sed -n "${s},${e}p" "$RA"
            done
            echo
            echo "===== C. SettingPage: 行结构与导入 ====="
            sed -n '1,45p' "$SP"
            echo "--- 关键行 ---"
            grep -nE 'onClick|Screen\.|SettingItem|CardGroup|item\(|navigate' "$SP" | head -80
            echo
            echo "===== D. WorkflowEngine 80-215 ====="
            sed -n '80,215p' "$WE"
          } > "$OUT"
          wc -l "$OUT"

      - name: Commit dump
        run: |
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add -f .di-wiring.txt
          git commit -m "ci: wiring dump" || true
          git push origin HEAD:master || (git pull --rebase origin master && git push origin HEAD:master)
