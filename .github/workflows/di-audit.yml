name: DI Audit

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/di-audit.yml'

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Dump workflow execute section
        run: |
          set -u
          WE=app/src/main/java/me/rerere/rikkahub/workflow/execution/WorkflowEngine.kt
          sed -n '215,350p' "$WE" > .di-block2.txt
          wc -l .di-block2.txt

      - name: Commit dump
        run: |
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add -f .di-block2.txt
          git commit -m "ci: workflow execute block" || true
          git push origin HEAD:master || (git pull --rebase origin master && git push origin HEAD:master)
