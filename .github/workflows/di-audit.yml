name: DI Audit

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/di-audit.yml'

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Dump approval surface
        run: |
          set -u
          OUT=.di-audit.txt
          {
            echo "===== 1. 三个开关的文字在哪儿 ====="
            grep -rn '强制确认工具调用\|自动批准所有工具调用\|后台工作流拦截敏感工具\|自动批准\|每个工具调用' app/src/main --include='*.kt' --include='*.xml' || echo "none"
            echo
            echo "===== 2. 含审批字样的文件清单 ====="
            grep -rln '审批\|approval\|Approval\|requireApproval\|needsApproval' app/src/main/java --include='*.kt' | sort || echo "none"
            echo
            echo "===== 3. 那三个开关所在文件的全文 ====="
            FILES=$(grep -rl '强制确认工具调用\|自动批准所有工具调用\|后台工作流拦截敏感工具' app/src/main --include='*.kt' || true)
            echo "$FILES"
            for f in $FILES; do
              echo "----- $f"
              cat "$f"
            done
            echo
            echo "===== 4. 工作流审批相关的界面文件全文 ====="
            for f in app/src/main/java/me/rerere/rikkahub/workflow/tools/WorkflowApprovalRenderer.kt; do
              echo "----- $f"
              cat "$f"
            done
          } > "$OUT"
          wc -l "$OUT"

      - name: Commit dump
        run: |
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add -f .di-audit.txt
          git commit -m "ci: approval surface dump" || true
          git push origin HEAD:master || (git pull --rebase origin master && git push origin HEAD:master)
