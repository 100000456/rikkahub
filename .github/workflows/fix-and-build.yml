name: Fix and Build Debug APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-and-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Patch plugin sandbox compile errors
        run: |
          set -e
          F=app/src/main/java/me/rerere/rikkahub/plugin/webview/PluginWebViewPage.kt
          cp "$F" /tmp/PluginWebViewPage.kt.bak

          # 1) 可空串链式调用：e.message?.replace(a,b).replace(c,d) -> ...?.
          sed -i '277s/)\.replace(/)?.replace(/; 401s/)\.replace(/)?.replace(/; 1053s/)\.replace(/)?.replace(/' "$F"

          # 2) 模型返回取值：choices/message -> message.parts
          sed -i 's/response\.choices\.firstOrNull()?\.message?\.parts/response.message.parts/g' "$F"

          echo "--- patched windows ---"
          awk 'NR>=276&&NR<=279 || NR>=400&&NR<=402 || NR>=664&&NR<=670 || NR>=1052&&NR<=1054 || NR>=1344&&NR<=1350 {printf "%d| %s\n", NR, $0}' "$F"

          N1=$(grep -c 'response.message.parts' "$F" || true)
          N2=$(grep -c ')?.replace(' "$F" || true)
          echo "message.parts count = $N1 ; safe-replace count = $N2"
          test "$N1" = "2"
          test "$N2" -ge "3"

          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add -f "$F"
          git commit -m "插件沙箱：修编译报错（模型返回取文本 + 可空串链式调用）" || true
          git push origin HEAD:master || (git pull --rebase origin master && git push origin HEAD:master)

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web-ui/pnpm-lock.yaml

      - name: Install web-ui dependencies
        working-directory: web-ui
        run: |
          mkdir -p ../ci-logs
          pnpm install --frozen-lockfile 2>&1 | tee ../ci-logs/pnpm.log

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-debug-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Write placeholder google-services.json
        run: |
          mkdir -p app ci-logs
          cat > app/google-services.json <<'JSON_EOF'
          {
            "project_info": {
              "project_number": "123456789012",
              "firebase_url": "https://rikkahub-placeholder.firebaseio.com",
              "project_id": "rikkahub-placeholder",
              "storage_bucket": "rikkahub-placeholder.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:123456789012:android:0000000000000000000000",
                  "android_client_info": {
                    "package_name": "me.rerere.rikkahub.debug"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "AIzaSyDplaceholder000000000000000000000"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          JSON_EOF

      - name: Build debug APK
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew :app:assembleDebug --stacktrace 2>&1 | tee ci-logs/gradle.log

      - name: Dump failure info
        if: failure()
        run: |
          {
            echo "=== failure at $(date -u) ==="
            echo "--- gradle tail ---"; tail -n 500 ci-logs/gradle.log 2>/dev/null || true
          } > .ci-failure.txt
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add -f .ci-failure.txt
          git commit -m "ci: dump failure log" || true
          git push origin HEAD:master || true

      - name: Publish debug APK
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-build
          name: Debug Build
          prerelease: true
          body: |
            自用调试包，来源 commit ${{ github.sha }}

            基于 RikkaHub 源码，debug 签名，包名带 .debug 后缀，可与橘瓣共存。
          files: app/build/outputs/apk/debug/*.apk
