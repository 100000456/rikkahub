name: Fix and Build Debug APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-and-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Patch proactive message pending-intent nullability
        run: |
          set -e
          F=app/src/main/java/me/rerere/rikkahub/data/service/ProactiveMessageService.kt
          # 关定时的时候是去"找"那个待发射的闹钟，找不到本来就会返回空。
          # 那个函数原来写着一定返回东西，空值一钻出来就当场崩。
          if grep -q '): PendingIntent =' "$F"; then
            sed -i 's/): PendingIntent =/): PendingIntent? =/' "$F"
          fi
          if ! grep -q 'FLAG_UPDATE_CURRENT) ?: return' "$F"; then
            sed -i 's/pendingIntent(context, PendingIntent.FLAG_UPDATE_CURRENT)/pendingIntent(context, PendingIntent.FLAG_UPDATE_CURRENT) ?: return/' "$F"
          fi
          test "$(grep -c '): PendingIntent? =' "$F")" = "1"
          test "$(grep -c 'FLAG_UPDATE_CURRENT) ?: return' "$F")" = "1"
          echo "--- patched ---"
          grep -n 'PendingIntent? =\|FLAG_NO_CREATE\|FLAG_UPDATE_CURRENT) ?: return' "$F"
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add -f "$F"
          git commit -m "主动消息：关掉定时的时候不再当场炸（待发射的闹钟可能本来就不存在）" || true
          git push origin HEAD:master || (git pull --rebase origin master && git push origin HEAD:master)

      - name: Record same-family risks
        run: |
          set -u
          {
            echo "=== 还宣称一定返回值、但可能拿到空的 PendingIntent 的地方 ==="
            grep -rn '): PendingIntent =' app/src/main/java --include='*.kt' || echo "none"
            echo
            echo "=== 用到 FLAG_NO_CREATE（找不到就返回空）的地方 ==="
            grep -rn 'FLAG_NO_CREATE' app/src/main/java --include='*.kt' || echo "none"
            echo
            echo "=== PendingIntent.get* 调用点 ==="
            grep -rn 'PendingIntent.get' app/src/main/java --include='*.kt' || echo "none"
          } > .ci-diag.txt
          cat .ci-diag.txt
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add -f .ci-diag.txt
          git commit -m "ci: 记一下同类隐患的分布" || true
          git push origin HEAD:master || (git pull --rebase origin master && git push origin HEAD:master)

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web-ui/pnpm-lock.yaml

      - name: Install web-ui dependencies
        working-directory: web-ui
        run: |
          mkdir -p ../ci-logs
          pnpm install --frozen-lockfile 2>&1 | tee ../ci-logs/pnpm.log

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-debug-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Write placeholder google-services.json
        run: |
          mkdir -p app ci-logs
          cat > app/google-services.json <<'JSON_EOF'
          {
            "project_info": {
              "project_number": "123456789012",
              "firebase_url": "https://rikkahub-placeholder.firebaseio.com",
              "project_id": "rikkahub-placeholder",
              "storage_bucket": "rikkahub-placeholder.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:123456789012:android:0000000000000000000000",
                  "android_client_info": {
                    "package_name": "me.rerere.rikkahub.debug"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "AIzaSyDplaceholder000000000000000000000"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          JSON_EOF

      - name: Build debug APK
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew :app:assembleDebug --stacktrace 2>&1 | tee ci-logs/gradle.log

      - name: Dump failure info
        if: failure()
        run: |
          {
            echo "=== failure at $(date -u) ==="
            echo "--- gradle tail ---"; tail -n 500 ci-logs/gradle.log 2>/dev/null || true
          } > .ci-failure.txt
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add -f .ci-failure.txt
          git commit -m "ci: dump failure log" || true
          git push origin HEAD:master || true

      - name: Publish debug APK
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-build
          name: Debug Build
          prerelease: true
          body: |
            自用调试包，来源 commit ${{ github.sha }}

            基于 RikkaHub 源码，debug 签名，包名带 .debug 后缀，可与橘瓣共存。
          files: app/build/outputs/apk/debug/*.apk

