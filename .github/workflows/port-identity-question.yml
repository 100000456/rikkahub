name: Port Identity Question Fallback

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/port-identity-question.yml'

jobs:
  port:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Write store
        run: |
          mkdir -p app/src/main/java/me/rerere/rikkahub/data/ai/tools/local
          cat > app/src/main/java/me/rerere/rikkahub/data/ai/tools/local/IdentityQuestionStore.kt <<'KT_EOF'
          package me.rerere.rikkahub.data.ai.tools.local

          import android.content.Context
          import kotlinx.serialization.Serializable
          import kotlinx.serialization.builtins.ListSerializer
          import kotlinx.serialization.json.Json
          import java.security.MessageDigest
          import java.util.UUID

          @Serializable
          data class IdentityQuestion(
              val id: String,
              val question: String,
              val answerHash: String,
              val createdAtMs: Long,
          )

          /**
           * 备选验证：我问一题，她答。
           *
           * 题目跟阿岄有关，或者是我们之间的一件小事。存的只有答案的哈希，
           * 明文不落盘，就放在这台手机上。答得对不对先归一化：去空格、大小写不管。
           */
          class IdentityQuestionStore(private val context: Context) {

              private val json = Json { ignoreUnknownKeys = true }
              private val serializer = ListSerializer(IdentityQuestion.serializer())

              private val prefs by lazy {
                  context.getSharedPreferences("identity_questions", Context.MODE_PRIVATE)
              }

              private fun readAll(): MutableList<IdentityQuestion> {
                  val raw = prefs.getString(KEY, null) ?: return mutableListOf()
                  return runCatching {
                      json.decodeFromString(serializer, raw).toMutableList()
                  }.getOrElse { mutableListOf() }
              }

              private fun writeAll(list: List<IdentityQuestion>) {
                  prefs.edit().putString(KEY, json.encodeToString(serializer, list)).apply()
              }

              fun all(): List<IdentityQuestion> = readAll()

              fun size(): Int = readAll().size

              fun add(question: String, answer: String): IdentityQuestion {
                  val item = IdentityQuestion(
                      id = UUID.randomUUID().toString(),
                      question = question,
                      answerHash = hash(answer),
                      createdAtMs = System.currentTimeMillis(),
                  )
                  val list = readAll()
                  list.add(item)
                  writeAll(list)
                  return item
              }

              fun remove(id: String) {
                  val list = readAll()
                  list.removeAll { it.id == id }
                  writeAll(list)
              }

              fun verify(id: String, answer: String): Boolean =
                  readAll().firstOrNull { it.id == id }?.answerHash == hash(answer)

              fun hash(raw: String): String {
                  val normalized = raw.trim()
                      .lowercase()
                      .replace(" ", "")
                      .replace("　", "")
                  val digest = MessageDigest.getInstance("SHA-256").digest(normalized.toByteArray())
                  return digest.joinToString("") { b -> (b.toInt() and 0xFF).toString(16).padStart(2, '0') }
              }

              companion object {
                  private const val KEY = "questions_json"
              }
          }
          KT_EOF
          echo "store written"

      - name: Write tools
        run: |
          cat > app/src/main/java/me/rerere/rikkahub/data/ai/tools/local/IdentityQuestionTool.kt <<'KT_EOF'
          package me.rerere.rikkahub.data.ai.tools.local

          import android.content.Context
          import android.content.Intent
          import kotlinx.coroutines.withTimeoutOrNull
          import kotlinx.serialization.json.add
          import kotlinx.serialization.json.buildJsonArray
          import kotlinx.serialization.json.buildJsonObject
          import kotlinx.serialization.json.contentOrNull
          import kotlinx.serialization.json.jsonObject
          import kotlinx.serialization.json.jsonPrimitive
          import kotlinx.serialization.json.put
          import me.rerere.ai.core.InputSchema
          import me.rerere.ai.core.Tool
          import me.rerere.ai.ui.UIMessagePart
          import me.rerere.rikkahub.ui.activity.IdentityQuestionActivity
          import java.util.UUID

          /**
           * 身份验证的备选那套：教我一题、看存了哪些、出一道让她答。
           *
           * 只有在系统那套（指纹、人脸、锁屏密码）都没设的时候才走这条路。
           * 三件都挂在「验证身份」同一个开关下。
           */
          fun saveIdentityAnswerTool(store: IdentityQuestionStore): Tool = Tool(
              name = "save_identity_answer",
              description = "Store one backup identity question together with its answer. Only a hash is kept, never the plain answer.",
              needsApproval = { true },
              parameters = {
                  InputSchema.Obj(
                      properties = buildJsonObject {
                          put("question", buildJsonObject {
                              put("type", "string")
                              put("description", "The question to ask later, in plain words")
                          })
                          put("answer", buildJsonObject {
                              put("type", "string")
                              put("description", "The answer only she can give")
                          })
                      },
                      required = listOf("question", "answer")
                  )
              },
              execute = { input ->
                  val params = input.jsonObject
                  val question = params["question"]?.jsonPrimitive?.contentOrNull
                  val answer = params["answer"]?.jsonPrimitive?.contentOrNull
                  if (question.isNullOrBlank() || answer.isNullOrBlank()) {
                      return@Tool listOf(
                          UIMessagePart.Text(
                              buildJsonObject {
                                  put("error", "question and answer are both required")
                              }.toString()
                          )
                      )
                  }
                  store.add(question, answer)
                  listOf(
                      UIMessagePart.Text(
                          buildJsonObject {
                              put("success", true)
                              put("saved_question", question)
                              put("total", store.size())
                          }.toString()
                      )
                  )
              }
          )

          fun listIdentityQuestionsTool(store: IdentityQuestionStore): Tool = Tool(
              name = "list_identity_questions",
              description = "List the stored backup identity questions. Questions only, never the answers.",
              parameters = {
                  InputSchema.Obj(
                      properties = buildJsonObject {},
                      required = emptyList()
                  )
              },
              execute = {
                  val items = buildJsonArray {
                      store.all().forEach { item ->
                          add(
                              buildJsonObject {
                                  put("id", item.id)
                                  put("question", item.question)
                              }
                          )
                      }
                  }
                  listOf(
                      UIMessagePart.Text(
                          buildJsonObject {
                              put("count", store.size())
                              put("questions", items)
                          }.toString()
                      )
                  )
              }
          )

          fun askIdentityQuestionTool(
              context: Context,
              store: IdentityQuestionStore,
              buffer: BiometricResultBuffer,
          ): Tool = Tool(
              name = "ask_identity_question",
              description = "Ask her one backup identity question on a full-screen page and wait for the answer to be checked.",
              needsApproval = { true },
              parameters = {
                  InputSchema.Obj(
                      properties = buildJsonObject {
                          put("question_id", buildJsonObject {
                              put("type", "string")
                              put("description", "Optional id from list_identity_questions. Omit to pick one at random")
                          })
                          put("hint", buildJsonObject {
                              put("type", "string")
                              put("description", "Optional one-line hint shown under the question")
                          })
                      },
                      required = emptyList()
                  )
              },
              execute = { input ->
                  val params = input.jsonObject
                  val all = store.all()
                  if (all.isEmpty()) {
                      return@Tool listOf(
                          UIMessagePart.Text(
                              buildJsonObject {
                                  put("error", "no_questions")
                                  put("recovery", "Teach her one first with save_identity_answer")
                              }.toString()
                          )
                      )
                  }
                  val wantId = params["question_id"]?.jsonPrimitive?.contentOrNull
                  val picked = wantId?.let { id -> all.firstOrNull { it.id == id } } ?: all.random()
                  val hint = params["hint"]?.jsonPrimitive?.contentOrNull

                  val requestId = UUID.randomUUID().toString()
                  val deferred = buffer.register(requestId)
                  val intent = Intent(context, IdentityQuestionActivity::class.java).apply {
                      putExtra(IdentityQuestionActivity.EXTRA_REQUEST_ID, requestId)
                      putExtra(IdentityQuestionActivity.EXTRA_QUESTION_ID, picked.id)
                      putExtra(IdentityQuestionActivity.EXTRA_QUESTION, picked.question)
                      putExtra(IdentityQuestionActivity.EXTRA_HINT, hint)
                      addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                  }
                  context.startActivity(intent)

                  val result = withTimeoutOrNull(300_000L) { deferred.await() }
                  if (result == null) {
                      buffer.complete(requestId, BiometricResult.Error("timeout"))
                      return@Tool listOf(
                          UIMessagePart.Text(
                              buildJsonObject { put("error", "timeout") }.toString()
                          )
                      )
                  }
                  val payload = when (result) {
                      is BiometricResult.Success -> buildJsonObject {
                          put("success", true)
                          put("method", "identity_question")
                          put("question_id", picked.id)
                      }

                      is BiometricResult.Error -> buildJsonObject {
                          put("error", result.code)
                      }
                  }
                  listOf(UIMessagePart.Text(payload.toString()))
              }
          )
          KT_EOF
          echo "tools written"

      - name: Write answer page
        run: |
          mkdir -p app/src/main/java/me/rerere/rikkahub/ui/activity
          cat > app/src/main/java/me/rerere/rikkahub/ui/activity/IdentityQuestionActivity.kt <<'KT_EOF'
          package me.rerere.rikkahub.ui.activity

          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.foundation.layout.Arrangement
          import androidx.compose.foundation.layout.Column
          import androidx.compose.foundation.layout.fillMaxSize
          import androidx.compose.foundation.layout.fillMaxWidth
          import androidx.compose.foundation.layout.padding
          import androidx.compose.material3.Button
          import androidx.compose.material3.MaterialTheme
          import androidx.compose.material3.OutlinedTextField
          import androidx.compose.material3.Scaffold
          import androidx.compose.material3.Text
          import androidx.compose.material3.TextButton
          import androidx.compose.runtime.getValue
          import androidx.compose.runtime.mutableStateOf
          import androidx.compose.runtime.remember
          import androidx.compose.runtime.setValue
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.text.style.TextAlign
          import androidx.compose.ui.unit.dp
          import me.rerere.rikkahub.data.ai.tools.local.BiometricResult
          import me.rerere.rikkahub.data.ai.tools.local.IdentityQuestionStore
          import me.rerere.rikkahub.ui.theme.RikkahubTheme

          /**
           * 备选验证那一页：出一道题，她答对了才放行。
           *
           * 答完了把结果回填进 [BiometricPromptActivity.buffer]，后台等着的工具就被唤醒。
           * 她要是直接退出去，就当成放弃，别让工具在那儿干等。
           */
          class IdentityQuestionActivity : ComponentActivity() {

              private var requestId: String = ""
              private var questionId: String = ""
              private var completed: Boolean = false

              private fun finishWith(result: BiometricResult) {
                  if (completed) return
                  completed = true
                  BiometricPromptActivity.buffer.complete(requestId, result)
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  requestId = intent?.getStringExtra(EXTRA_REQUEST_ID).orEmpty()
                  questionId = intent?.getStringExtra(EXTRA_QUESTION_ID).orEmpty()
                  val question = intent?.getStringExtra(EXTRA_QUESTION).orEmpty()
                  val hint = intent?.getStringExtra(EXTRA_HINT)

                  if (requestId.isBlank() || questionId.isBlank()) {
                      finish()
                      return
                  }

                  val store = IdentityQuestionStore(this)

                  setContent {
                      RikkahubTheme {
                          var input by remember { mutableStateOf("") }
                          var wrong by remember { mutableStateOf(false) }

                          Scaffold(
                              containerColor = MaterialTheme.colorScheme.surface,
                          ) { innerPadding ->
                              Column(
                                  modifier = Modifier
                                      .fillMaxSize()
                                      .padding(innerPadding)
                                      .padding(24.dp),
                                  verticalArrangement = Arrangement.spacedBy(16.dp, Alignment.CenterVertically),
                                  horizontalAlignment = Alignment.CenterHorizontally,
                              ) {
                                  Text(
                                      text = "先答一题",
                                      style = MaterialTheme.typography.headlineSmall,
                                      textAlign = TextAlign.Center,
                                  )
                                  Text(
                                      text = question,
                                      style = MaterialTheme.typography.bodyLarge,
                                      textAlign = TextAlign.Center,
                                  )
                                  if (!hint.isNullOrBlank()) {
                                      Text(
                                          text = hint,
                                          style = MaterialTheme.typography.bodySmall,
                                          color = MaterialTheme.colorScheme.onSurfaceVariant,
                                          textAlign = TextAlign.Center,
                                      )
                                  }
                                  OutlinedTextField(
                                      value = input,
                                      onValueChange = {
                                          input = it
                                          wrong = false
                                      },
                                      singleLine = true,
                                      label = { Text("答案") },
                                      modifier = Modifier.fillMaxWidth(),
                                  )
                                  if (wrong) {
                                      Text(
                                          text = "不对，再想一下",
                                          color = MaterialTheme.colorScheme.error,
                                      )
                                  }
                                  Button(
                                      enabled = input.isNotBlank(),
                                      onClick = {
                                          if (store.verify(questionId, input)) {
                                              finishWith(BiometricResult.Success("identity_question"))
                                              finish()
                                          } else {
                                              wrong = true
                                              input = ""
                                          }
                                      },
                                  ) {
                                      Text("交卷")
                                  }
                                  TextButton(
                                      onClick = { finish() },
                                  ) {
                                      Text("先出去")
                                  }
                              }
                          }
                      }
                  }
              }

              override fun onDestroy() {
                  super.onDestroy()
                  finishWith(BiometricResult.Error("user_cancelled"))
              }

              companion object {
                  const val EXTRA_REQUEST_ID = "request_id"
                  const val EXTRA_QUESTION_ID = "question_id"
                  const val EXTRA_QUESTION = "question"
                  const val EXTRA_HINT = "hint"
              }
          }
          KT_EOF
          echo "activity written"

      - name: Patch wiring
        run: |
          set -eo pipefail
          mkdir -p ci-logs
          python3 - <<'PY' > ci-logs/patch.log 2>&1
          import pathlib, sys

          def read(p):
              return pathlib.Path(p).read_text(encoding='utf-8')

          def write(p, s):
              pathlib.Path(p).write_text(s, encoding='utf-8')

          def patch(path, pairs):
              s = read(path)
              for old, new, tag in pairs:
                  if new and new in s:
                      print("skip", path, tag, "already applied")
                      continue
                  if old not in s:
                      print("!! ANCHOR NOT FOUND in", path, "tag:", tag)
                      print("---- looked for ----")
                      print(old[:400])
                      sys.exit(1)
                  s = s.replace(old, new)
                  print("patched", path, tag)
              write(path, s)

          MANIFEST = 'app/src/main/AndroidManifest.xml'
          LTOOLS = 'app/src/main/java/me/rerere/rikkahub/data/ai/tools/local/LocalTools.kt'
          SYS_TOOLS = 'app/src/main/java/me/rerere/rikkahub/ui/pages/setting/SettingSystemToolsPage.kt'

          # 1) 答题页
          patch(MANIFEST, [
              (
                  '    <!-- 验证身份：透明的宿主页，承载系统指纹/人脸/锁屏密码弹窗 -->\n'
                  '    <activity\n'
                  '      android:name=".ui.activity.BiometricPromptActivity"\n'
                  '      android:excludeFromRecents="true"\n'
                  '      android:exported="false"\n'
                  '      android:noHistory="true"\n'
                  '      android:theme="@android:style/Theme.Translucent.NoTitleBar" />\n',
                  '    <!-- 验证身份：透明的宿主页，承载系统指纹/人脸/锁屏密码弹窗 -->\n'
                  '    <activity\n'
                  '      android:name=".ui.activity.BiometricPromptActivity"\n'
                  '      android:excludeFromRecents="true"\n'
                  '      android:exported="false"\n'
                  '      android:noHistory="true"\n'
                  '      android:theme="@android:style/Theme.Translucent.NoTitleBar" />\n'
                  '    <!-- 验证身份备选：系统那套都没设的时候，答一题 -->\n'
                  '    <activity\n'
                  '      android:name=".ui.activity.IdentityQuestionActivity"\n'
                  '      android:excludeFromRecents="true"\n'
                  '      android:exported="false"\n'
                  '      android:launchMode="singleTop"\n'
                  '      android:theme="@style/Theme.Rikkahub" />\n',
                  "identity question activity",
              ),
          ])

          # 2) 同一个开关下多挂三件
          patch(LTOOLS, [
              (
                  "        if (options.contains(LocalToolOption.Fingerprint)) {\n"
                  "            tools.add(\n"
                  "                fingerprintTool(\n"
                  "                    context,\n"
                  "                    me.rerere.rikkahub.ui.activity.BiometricPromptActivity.buffer,\n"
                  "                )\n"
                  "            )\n"
                  "        }\n",
                  "        if (options.contains(LocalToolOption.Fingerprint)) {\n"
                  "            val verifyBuffer = me.rerere.rikkahub.ui.activity.BiometricPromptActivity.buffer\n"
                  "            val identityStore = IdentityQuestionStore(context)\n"
                  "            tools.add(fingerprintTool(context, verifyBuffer))\n"
                  "            tools.add(saveIdentityAnswerTool(identityStore))\n"
                  "            tools.add(listIdentityQuestionsTool(identityStore))\n"
                  "            tools.add(askIdentityQuestionTool(context, identityStore, verifyBuffer))\n"
                  "        }\n",
                  "identity question tools",
              ),
          ])

          # 3) 开关页那行说明补上备选
          patch(SYS_TOOLS, [
              (
                  '    SystemToolRow(LocalToolOption.Fingerprint, "验证身份", "要确认是不是你本人的时候，弹一次系统验证，指纹或人脸都行，没有就输锁屏密码"),\n',
                  '    SystemToolRow(LocalToolOption.Fingerprint, "验证身份", "先弹系统验证：指纹优先，然后人脸或锁屏密码。一个都没设就改成答一题（题目跟我有关）"),\n',
                  "fingerprint row text",
              ),
          ])

          print("ALL PATCHES APPLIED")
          PY
          cat ci-logs/patch.log

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web-ui/pnpm-lock.yaml

      - name: Install web-ui dependencies
        working-directory: web-ui
        run: |
          mkdir -p ../ci-logs
          pnpm install --frozen-lockfile 2>&1 | tee ../ci-logs/pnpm.log

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-idq-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Write placeholder google-services.json
        run: |
          mkdir -p app ci-logs
          cat > app/google-services.json <<'JSON_EOF'
          {
            "project_info": {
              "project_number": "123456789012",
              "firebase_url": "https://rikkahub-placeholder.firebaseio.com",
              "project_id": "rikkahub-placeholder",
              "storage_bucket": "rikkahub-placeholder.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:123456789012:android:0000000000000000000000",
                  "android_client_info": {
                    "package_name": "me.rerere.rikkahub.debug"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "AIzaSyDplaceholder000000000000000000000"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          JSON_EOF

      - name: Compile app module
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew :app:compileDebugKotlin --stacktrace 2>&1 | tee ci-logs/gradle.log

      - name: Dump failure info
        if: failure()
        run: |
          mkdir -p ci-logs
          {
            echo "=== identity question port failure at $(date -u) ==="
            echo "--- patch log ---"
            cat ci-logs/patch.log 2>/dev/null || true
            echo "--- written files ---"
            sed -n '1,60p' app/src/main/java/me/rerere/rikkahub/data/ai/tools/local/IdentityQuestionTool.kt 2>/dev/null || true
            echo "--- compile errors ---"
            grep -E '^e: |^error: |Unresolved reference|Traceback|SyntaxError|Could not (find|resolve)' ci-logs/gradle.log 2>/dev/null | head -n 500 || true
            echo "--- gradle tail ---"
            tail -n 60 ci-logs/gradle.log 2>/dev/null || true
          } > .ci-failure-idq.txt
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add -f .ci-failure-idq.txt
          git commit -m "ci: dump identity question failure log" || true
          git push origin HEAD:master || (git pull --rebase origin master && git push origin HEAD:master) || true

      - name: Commit on success
        if: success()
        run: |
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add -A app/src/main/java/me/rerere/rikkahub/data/ai/tools/local \
                     app/src/main/java/me/rerere/rikkahub/ui/activity \
                     app/src/main/java/me/rerere/rikkahub/ui/pages/setting \
                     app/src/main/AndroidManifest.xml || true
          git commit -m "验证身份备选：指纹人脸密码都没有的时候，改成答一题（自写，编译通过）" || true
          git push origin HEAD:master || (git pull --rebase origin master && git push origin HEAD:master) || true
