name: Warm Room Schema

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/warm-schema.yml'

jobs:
  warm:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web-ui/pnpm-lock.yaml

      - name: Install web-ui dependencies
        working-directory: web-ui
        run: pnpm install --frozen-lockfile

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-schema-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Write placeholder google-services.json
        run: |
          mkdir -p app
          cat > app/google-services.json <<'JSON_EOF'
          {
            "project_info": {
              "project_number": "123456789012",
              "firebase_url": "https://rikkahub-placeholder.firebaseio.com",
              "project_id": "rikkahub-placeholder",
              "storage_bucket": "rikkahub-placeholder.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:123456789012:android:0000000000000000000000",
                  "android_client_info": {
                    "package_name": "me.rerere.rikkahub.debug"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "AIzaSyDplaceholder000000000000000000000"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          JSON_EOF

      - name: Export current Room schema
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew :app:kspDebugKotlin --stacktrace 2>&1 | tail -n 40

      - name: Commit schema
        run: |
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add -f app/schemas
          git commit -m "ci: 导出数据库 v26 表结构存档（自动迁移需要）" || true
          git push origin HEAD:master || (git pull --rebase origin master && git push origin HEAD:master) || true
          ls app/schemas/me.rerere.rikkahub.data.db.AppDatabase/ | sort -n | tail -n 5

      - name: Kick off port pipeline
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run build-apk.yml --ref master && echo "port pipeline dispatched" || echo "dispatch failed"
